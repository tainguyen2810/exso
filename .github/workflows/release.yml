name: release

# Builds the install package: code + vendor (no dev packages) + built assets.
# Unzip it on WAMP / shared hosting and open the site to run the installer,
# like WordPress; no composer, npm or SSH needed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: intl, gd, zip, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install PHP packages (no dev)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Make the package
        run: |
          NAME="exso-${GITHUB_REF_NAME//\//-}"
          echo "PACKAGE=$NAME.zip" >> "$GITHUB_ENV"
          rm -f .env bootstrap/cache/*.php
          find storage -type f ! -name .gitignore -delete
          zip -q -r "$NAME.zip" . \
            -x '.git/*' -x '.github/*' -x 'node_modules/*' -x 'tests/*' \
            -x '.env' -x '*.zip' -x 'database/database.sqlite' -x 'public/hot'

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" "$PACKAGE" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
